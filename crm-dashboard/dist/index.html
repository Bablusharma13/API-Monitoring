<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRM Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- CRM UI CDN (override layer) -->
    <!-- <link rel="stylesheet" href="https://ui-cdn.allheartweb.info/crm-ui.css" /> -->
    <script type="module" crossorigin src="/assets/index-QWO72VcO.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-PireMroY.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        try {
          var k = "crm-dashboard-theme";
          var t = localStorage.getItem(k);
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
          document.documentElement.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
  </body>
</html>
