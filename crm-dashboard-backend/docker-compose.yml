services:
  crm-frontend:
    build: .
    ports:
      - "7000:7000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis-crm-dashboard:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
